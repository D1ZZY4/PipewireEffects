[workspace]
resolver = "3"
members = [
    "crates/app",
    "crates/core",
    "crates/dsp",
    "crates/engine",
    "crates/presets",
    "crates/ui",
]
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
authors = ["PipewireEffects contributors"]
repository = "https://github.com/D1ZZY4/PipewireEffects"
description = "A PipeWire audio effects processor for the Linux desktop"

[workspace.dependencies]
pwe-core = { path = "crates/core", version = "0.1.0" }
pwe-dsp = { path = "crates/dsp", version = "0.1.0" }
pwe-engine = { path = "crates/engine", version = "0.1.0" }
pwe-presets = { path = "crates/presets", version = "0.1.0" }
pwe-ui = { path = "crates/ui", version = "0.1.0" }

crossbeam-queue = "0.3"
adw = { package = "libadwaita", version = "0.9", features = ["v1_5", "gtk_v4_10"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
pipewire = { version = "0.10", features = ["v0_3_49"] }
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
