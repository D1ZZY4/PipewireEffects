<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>PipeWire Effects</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8faff"/>
      <stop offset="1" stop-color="#e6ecfb"/>
    </linearGradient>
    <radialGradient id="wash-cool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9dbffb"/>
      <stop offset="0.55" stop-color="#b3cefc" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#c3d7fc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wash-warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bfadf9"/>
      <stop offset="0.55" stop-color="#cebffb" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#dbd1fd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0.16" y1="0.92" x2="0.84" y2="0.08">
      <stop offset="0" stop-color="#3f7bf0"/>
      <stop offset="0.55" stop-color="#6f6cf3"/>
      <stop offset="1" stop-color="#a463f0"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0" stop-color="#4080f2"/>
      <stop offset="1" stop-color="#a263ef"/>
    </linearGradient>
    <clipPath id="tile-clip">
      <rect width="128" height="128" rx="30"/>
    </clipPath>
    <filter id="depth" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2.4" stdDeviation="3" flood-color="#25316e" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g clip-path="url(#tile-clip)">
    <rect width="128" height="128" fill="url(#tile)"/>
    <circle cx="10" cy="4" r="70" fill="url(#wash-cool)"/>
    <circle cx="122" cy="126" r="64" fill="url(#wash-warm)"/>
  </g>
  <rect x="0.75" y="0.75" width="126.5" height="126.5" rx="29.25" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5"/>

  <g filter="url(#depth)">
    <path d="M40.49 96.36A40 40 0 1 1 87.51 96.36" fill="none" stroke="url(#ring)" stroke-width="9.5" stroke-linecap="round"/>
    <g fill="url(#bars)">
      <rect x="33.5" y="51.75" width="9" height="24.5" rx="4.5"/>
      <rect x="46.5" y="44.6" width="9" height="38.8" rx="4.5"/>
      <rect x="59.5" y="36.95" width="9" height="54.1" rx="4.5"/>
      <rect x="72.5" y="44.6" width="9" height="38.8" rx="4.5"/>
      <rect x="85.5" y="51.75" width="9" height="24.5" rx="4.5"/>
    </g>
  </g>
</svg>
